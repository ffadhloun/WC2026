<html lang="en">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div>
      <h1>🏆 FIFA World Cup 2026 <em>· Tunisia Time</em></h1>
      <p class="hdr-sub" id="hdr-sub">Loading schedule…</p>
    </div>
    <div class="hdr-right">
      <span class="api-dot d-spin" id="apiDot"></span>
      <span class="api-txt" id="apiTxt">Connecting…</span>
      <button class="tbtn" id="tzBtn" onclick="toggleTZ()">🌍 Local time</button>
      <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </div>
  </div>
</header>

<div class="sbar">
  <div class="sbar-in">
    <div class="sp"><span class="sdot sg"></span><b id="cnt-g">–</b> good time</div>
    <div class="sp"><span class="sdot sy"></span><b id="cnt-y">–</b> borderline</div>
    <div class="sp"><span class="sdot sr"></span><b id="cnt-r">–</b> rough</div>
    <div class="sp"><span class="sdot sa"></span><b id="cnt-tn">–</b> 🇹🇳 Tunisia</div>
    <div class="sp"><b id="cnt-tot">–</b> matches total</div>
  </div>
</div>

<div class="searchbar">
  <div class="searchbar-in">
    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search team (e.g. Tunisia, Brazil, France)…" oninput="onSearchInput()">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
    </div>
    <div class="tools-group">
      <button class="tbtn tool-btn" onclick="exportAllIcs(false)" title="Download .ics for every match">📥 Export all</button>
      <button class="tbtn tool-btn" onclick="exportAllIcs(true)" title="Download .ics for Tunisia matches only">📥 Export 🇹🇳</button>
      <button class="tbtn tool-btn" onclick="shareSchedule()" title="Share this schedule">🔗 Share</button>
    </div>
  </div>
</div>

<div class="fbar">
  <div class="fbar-in">
    <span class="flbl">Filter</span>
    <button class="fb active" data-f="all">All</button>
    <button class="fb" data-f="tn">🇹🇳 Tunisia</button>
    <button class="fb fg" data-f="green">🟢 Good hours</button>
    <button class="fb fy" data-f="yellow">🟡 Borderline</button>
    <button class="fb ffav" data-f="favorites" id="btn-favs">⭐ My matches</button>
    <button class="fb ft" data-f="today" id="btn-today">📅 Today</button>
    <button class="fb fs" data-f="standings" id="btn-standings">📊 Standings</button>
    <button class="fb fbr" data-f="bracket" id="btn-bracket">🏟️ Bracket</button>
    <button class="fb fgb" data-f="goldenboot" id="btn-goldenboot">👟 Golden Boot</button>
  </div>
</div>

<main class="main" id="schedule">
  <div class="day-block">
    <div style="height:10px;width:120px;background:var(--border);border-radius:4px;margin-bottom:12px"></div>
    <div class="day-grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </div>
</main>

<div class="panel-overlay" id="panelOverlay" onclick="closeMatchPanel()"></div>
<aside class="match-panel" id="matchPanel">
  <div class="panel-hdr" id="panelHdr">
    <span class="panel-title" id="panelTitle">Match details</span>
    <button class="panel-close" onclick="closeMatchPanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<script src="app.js" defer></script>
</body>
</html>
