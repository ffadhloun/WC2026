<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 – Tunisia Time</title>
<style>
:root {
  --bg:#f2f1ed;--surface:#fff;--surface2:#eceae5;--border:rgba(0,0,0,0.08);
  --border-strong:rgba(0,0,0,0.15);--text:#111;--text-muted:#666;--text-faint:#aaa;
  --accent:#d42e35;--gold:#b8872a;--gold-bg:#fdf8ee;
  --green:#1a7a3f;--green-bg:#edf7f1;--yellow:#9a6200;--yellow-bg:#fdf6e3;
  --red:#c0392b;--red-bg:#fdf1f0;
  --gcal:#1a73e8;--gcal-bg:#e8f0fe;
  --r:10px;--rs:6px;--font:-apple-system,'Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
}
[data-theme="dark"]{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2233;--border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.14);--text:#e8eaf0;--text-muted:#8a90a8;--text-faint:#454d66;
  --accent:#e8474e;--gold:#d4a843;--gold-bg:rgba(212,168,67,0.1);
  --green:#2dcc6a;--green-bg:rgba(45,204,106,0.1);--yellow:#f0b429;--yellow-bg:rgba(240,180,41,0.1);
  --red:#f06060;--red-bg:rgba(240,96,96,0.1);
  --gcal:#8ab4f8;--gcal-bg:rgba(138,180,248,0.12);
  --shadow:0 1px 4px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4;min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:50}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr h1{font-size:1rem;font-weight:700;letter-spacing:.01em}
.hdr h1 em{color:var(--accent);font-style:normal}
.hdr-sub{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.tbtn{border:1px solid var(--border-strong);background:var(--surface2);color:var(--text-muted);padding:4px 10px;border-radius:var(--rs);cursor:pointer;font-size:.72rem;font-family:var(--font)}
.tbtn:hover{color:var(--text)}

/* ── STATS BAR ── */
.sbar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 20px}
.sbar-in{max-width:1280px;margin:0 auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sp{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--text-muted)}
.sp b{color:var(--text);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.dg{background:var(--green)}.dy{background:var(--yellow)}.dr{background:var(--red)}.da{background:var(--accent)}

/* ── FILTERS ── */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 20px;position:sticky;top:49px;z-index:40}
.fbar-in{max-width:1280px;margin:0 auto;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.flbl{font-size:.68rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-right:4px}
.fb{padding:4px 12px;border-radius:16px;border:1px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;font-size:.75rem;font-family:var(--font);transition:all .12s}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fb.fg.active{background:var(--green);border-color:var(--green);color:#fff}
.fb.fy.active{background:var(--yellow);border-color:var(--yellow);color:#fff}

/* ── LAYOUT ── */
.main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}

.day-block{margin-bottom:24px}
.day-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px}

/* THE GRID */
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}

/* ── MATCH CARD ── */
.mc{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  transition:border-color .14s,box-shadow .14s;
}
.mc:hover{border-color:var(--border-strong);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.mc.tn{border-left:3px solid var(--accent)}
.mc.fin{border-color:var(--gold);background:var(--gold-bg)}

/* card top row: group badge + time + dot */
.mc-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px 6px;border-bottom:1px solid var(--border);
}
.mc-badge{padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);letter-spacing:.03em}
.mc-badge.fin-b{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.mc-time-wrap{display:flex;align-items:center;gap:6px}
.mc-time{font-size:.95rem;font-weight:700;color:var(--text)}
.mc-dot{width:7px;height:7px;border-radius:50%}

/* card teams section */
.mc-teams{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:12px 12px 8px;flex:1;
}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;flex:1}
.mc-team img{width:32px;height:24px;border-radius:3px;object-fit:cover;border:1px solid var(--border)}
.mc-team .flag-fb,.flag-fb{border-radius:3px;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-faint);vertical-align:middle}
.mc-team .tname{font-size:.78rem;font-weight:600;color:var(--text);text-align:center;line-height:1.2;word-break:break-word}
.mc-vs{font-size:.68rem;color:var(--text-faint);font-weight:400;flex-shrink:0;padding-top:14px}
.fin-teams{text-align:center;padding:16px 12px 8px;flex:1;display:flex;align-items:center;justify-content:center}
.fin-lbl{font-size:.95rem;font-weight:700;color:var(--gold)}

/* card meta */
.mc-meta{padding:0 10px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mc-venue{font-size:.68rem;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mc-suit{font-size:.68rem;flex-shrink:0}
.sc-green{color:var(--green)}.sc-yellow{color:var(--yellow)}.sc-red{color:var(--red)}

/* card cal buttons */
.mc-cal{
  border-top:1px solid var(--border);padding:7px 8px;
  display:flex;gap:6px;
}
.cbtn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:5px 6px;border-radius:var(--rs);font-size:.7rem;font-weight:600;
  cursor:pointer;text-decoration:none;border:none;font-family:var(--font);
  transition:opacity .12s,transform .1s;white-space:nowrap;
}
.cbtn:hover{opacity:.82;transform:translateY(-1px)}
.cbtn:active{transform:translateY(0)}
.cg{background:var(--gcal-bg);color:var(--gcal);border:1px solid transparent}
.ci{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.cbtn svg{width:12px;height:12px;flex-shrink:0}

/* empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text-faint);font-size:.9rem;grid-column:1/-1}

/* ── LIVE SCORES ── */
.score-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px 2px;font-size:.82rem}
.score-num{font-size:1.1rem;font-weight:700;color:var(--text);min-width:18px;text-align:center}
.score-sep{color:var(--text-faint);font-size:.75rem}
.live-badge{display:inline-flex;align-items:center;gap:3px;background:#e8474e;color:#fff;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.live-pulse{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-ft{font-size:.65rem;color:var(--text-faint);text-align:center;padding-bottom:4px}
.status-ns{font-size:.65rem;color:var(--text-faint);text-align:center;padding-bottom:4px}
.mc.live-now{border-color:#e8474e;box-shadow:0 0 0 1px #e8474e22}



/* ── TODAY PINNED SECTION ── */
.today-section{margin-bottom:28px}
.today-header{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px}
.today-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.today-live-count{font-size:.68rem;background:#e8474e;color:#fff;padding:1px 7px;border-radius:10px;font-weight:700}
.refresh-btn{margin-left:auto;font-size:.68rem;color:var(--text-faint);background:none;border:none;cursor:pointer;font-family:var(--font);padding:2px 6px;border-radius:4px}
.refresh-btn:hover{color:var(--text);background:var(--surface2)}
.last-updated{font-size:.65rem;color:var(--text-faint);margin-left:4px}

.fb.ft.active{background:#1a73e8;border-color:#1a73e8;color:#fff}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .hdr{padding:10px 14px}
  .fbar{top:44px}
  .mc-team img,.mc-team .flag-fb{width:26px;height:20px}
  .mc-time{font-size:.85rem}
}
</style>
</head>

// ── FLAGS ──
function flag(name,size){
  const s=size||28,h=Math.round(s*0.75);
  const code=FLAGS[name];
  if(!code) return `<span class="flag-fb" style="width:${s}px;height:${h}px">${name.slice(0,2).toUpperCase()}</span>`;
  const cdnSize=s<=20?20:s<=40?40:80;
  const initials=name.slice(0,2).toUpperCase();
  return `<img src="https://flagcdn.com/w${cdnSize}/${code}.webp" width="${s}" height="${h}" alt="${name} flag" loading="lazy" style="border-radius:3px;border:1px solid var(--border);object-fit:cover;display:block" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flag-fb',textContent:'${initials}',style:'width:${s}px;height:${h}px'}))">`;
}

// ── HELPERS ──
function sc(s){return s.includes('🟢')?'green':s.includes('🟡')?'yellow':'red'}
function sl(s){return s.replace(/^[🟢🟡🔴]\s*/,'')}
function isTn(m){return m.home.includes('Tunisia')||m.away.includes('Tunisia')}
function gcalUrl(m){return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(m.title)}&dates=${m.gcal_start}/${m.gcal_end}&details=${encodeURIComponent(m.group+' | '+m.suitability)}&location=${encodeURIComponent(m.venue)}`}
function dlIcs(i){
  const m=M[i];
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WC2026//EN','BEGIN:VEVENT',
    `UID:wc2026-${m.gcal_start}-${i}@tn`,
    `DTSTART;TZID=Africa/Tunis:${m.ics_start}`,
    `DTEND;TZID=Africa/Tunis:${m.ics_end}`,
    `SUMMARY:${m.title}`,`LOCATION:${m.venue}`,
    `DESCRIPTION:${m.group} | ${m.suitability}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download=m.title.replace(/[^\w]/g,'_')+'.ics';a.click();
}

async function fetchLiveScores(){
  try{
    const today=new Date();
    const ymd=`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
    const r=await fetch(`${ESPN_URL}?dates=${ymd}`,{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    liveData={};
    (data.events||[]).forEach(ev=>{
      const comp=ev.competitions?.[0];
      if(!comp) return;
      const teams=comp.competitors||[];
      const home=teams.find(t=>t.homeAway==='home');
      const away=teams.find(t=>t.homeAway==='away');
      if(!home||!away) return;
      const hn=ESPN_MAP[home.team.displayName]||home.team.displayName;
      const an=ESPN_MAP[away.team.displayName]||away.team.displayName;
      const st=comp.status?.type?.name||'';
      const clock=comp.status?.displayClock||'';
      liveData[hn+'|'+an]={
        status:st, // STATUS_IN_PROGRESS, STATUS_FINAL, STATUS_SCHEDULED
        homeScore:home.score||'0',
        awayScore:away.score||'0',
        clock:clock,
        period:comp.status?.period||0
      };
    });
    lastUpdated=new Date();
    const active=document.querySelector('.fb.active');
    if(active?.dataset.f==='today') renderToday();
    else updateScoreBadges();
  } catch(e){
    console.warn('ESPN fetch failed:',e.message);
    // silently fail — no UI error, scores just won't show
  }
}

function scoreHtml(key){
  const d=liveData[key];
  if(!d) return '';
  if(d.status==='STATUS_IN_PROGRESS'){
    return `<div class="score-bar">
      <span class="score-num">${d.homeScore}</span>
      <span class="score-sep">–</span>
      <span class="score-num">${d.awayScore}</span>
      <span class="live-badge"><span class="live-pulse"></span>${d.clock||'LIVE'}</span>
    </div>`;
  }
  if(d.status==='STATUS_FINAL'){
    return `<div class="score-bar">
      <span class="score-num">${d.homeScore}</span>
      <span class="score-sep">–</span>
      <span class="score-num">${d.awayScore}</span>
      <span style="font-size:.62rem;color:var(--text-faint);margin-left:4px">FT</span>
    </div>`;
  }
  if(d.status==='STATUS_SCHEDULED'){
    return `<div class="status-ns">Scheduled</div>`;
  }
  return '';
}

function updateScoreBadges(){
  document.querySelectorAll('.mc[data-lkey]').forEach(card=>{
    const key=card.dataset.lkey;
    const el=card.querySelector('.score-inject');
    if(el) el.innerHTML=scoreHtml(key);
    const d=liveData[key];
    card.classList.toggle('live-now',!!(d&&d.status==='STATUS_IN_PROGRESS'));
  });
}

// ── TODAY ──
function todayStr(){
  const d=new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toDateString();
}
function isTodayMatch(m){
  return new Date(m.date).toDateString()===todayStr();
}

function renderToday(){
  const el=document.getElementById('schedule');
  const todayMatches=M.map((m,i)=>({m,i})).filter(({m})=>isTodayMatch(m));
  if(!todayMatches.length){
    el.innerHTML='<p class="empty">No matches today. Check the full schedule below.</p>';
    return;
  }
  const liveCount=todayMatches.filter(({m})=>{
    const d=liveData[m.home+'|'+m.away];
    return d&&d.status==='STATUS_IN_PROGRESS';
  }).length;
  const upd=lastUpdated?`<span class="last-updated">Updated ${lastUpdated.toLocaleTimeString()}</span>`:'';
  let html=`<div class="today-section">
    <div class="today-header">
      <span class="today-lbl">Today · ${new Date().toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span>
      ${liveCount?`<span class="today-live-count">${liveCount} LIVE</span>`:''}
      <button class="refresh-btn" onclick="fetchLiveScores()">↻ Refresh</button>
      ${upd}
    </div>
    <div class="day-grid">`;
  todayMatches.forEach(({m,i})=>{ html+=buildCard(m,i); });
  html+='</div></div>';
  el.innerHTML=html;
}

// ── CARD BUILDER ──
function buildCard(m,i){
  const s=sc(m.suitability),tn=isTn(m)?' tn':'',fin=m.group==='Final'?' fin':'';
  const badgeCls=m.group==='Final'?' fin-b':'';
  const lkey=m.home+'|'+m.away;
  const teamsHtml=m.group==='Final'
    ?`<div class="fin-teams"><span class="fin-lbl">🏆 World Cup Final</span></div>`
    :`<div class="mc-teams">
        <div class="mc-team">${flag(m.home,28)}<span class="tname">${m.home}</span></div>
        <div class="mc-vs">vs</div>
        <div class="mc-team">${flag(m.away,28)}<span class="tname">${m.away}</span></div>
      </div>`;
  return `<div class="mc${tn}${fin}" data-lkey="${lkey}">
    <div class="mc-top">
      <span class="mc-badge${badgeCls}">${m.group}</span>
      <div class="mc-time-wrap">
        <span class="mc-time">${m.time}</span>
        <span class="mc-dot d${s[0]}"></span>
      </div>
    </div>
    ${teamsHtml}
    <div class="score-inject">${scoreHtml(lkey)}</div>
    <div class="mc-meta">
      <span class="mc-venue">${m.venue}</span>
      <span class="mc-suit sc-${s}">${sl(m.suitability)}</span>
    </div>
    <div class="mc-cal">
      <a class="cbtn cg" href="${gcalUrl(m)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5C3.9 4 3 4.9 3 6v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
        Google Cal
      </a>
      <button class="cbtn ci" onclick="dlIcs(${i})">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 110 2 1 1 0 010-2zm4 11H8v-1.5l3-3 1.5 1.5 3-3 1.5 1.5V17z"/></svg>
        .ics
      </button>
    </div>
  </div>`;
}

// ── RENDER ──
function render(filter){
  if(filter==='today'){ renderToday(); return; }
  const byDate={};
  M.forEach((m,i)=>{
    const show=filter==='all'?true:filter==='tn'?isTn(m):filter==='green'?m.suitability.includes('🟢'):m.suitability.includes('🟡');
    if(!show)return;
    if(!byDate[m.display_date])byDate[m.display_date]=[];
    byDate[m.display_date].push({m,i});
  });
  let html='';
  for(const[date,items] of Object.entries(byDate)){
    html+=`<div class="day-block"><div class="day-lbl">${date}</div><div class="day-grid">`;
    items.forEach(({m,i})=>{ html+=buildCard(m,i); });
    html+='</div></div>';
  }
  document.getElementById('schedule').innerHTML=html||'<p class="empty">No matches for this filter.</p>';
}

// ── STATS ──
let g=0,y=0,r=0;
M.forEach(m=>{const s=sc(m.suitability);s==='green'?g++:s==='yellow'?y++:r++;});
document.getElementById('cg').textContent=g;
document.getElementById('cy').textContent=y;
document.getElementById('cr').textContent=r;

// ── FILTERS ──
document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.f);
    if(b.dataset.f==='today') fetchLiveScores();
  });
});

// ── THEME ──
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  document.getElementById('themeBtn').textContent=dark?'☀️ Light':'🌙 Dark';
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')!=='dark')}
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);

// ── INIT ──
render('all');
// Fetch scores silently on load — works once WC 2026 starts
fetchLiveScores();
// Auto-refresh every 60s
refreshTimer=setInterval(fetchLiveScores,60000);
</script>
</body>
</html>
