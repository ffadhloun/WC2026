<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 – Tunisia Time</title>
<style>
:root{
  --bg:#f2f1ed;--surface:#fff;--surface2:#eceae5;--border:rgba(0,0,0,0.08);
  --border-strong:rgba(0,0,0,0.16);--text:#111;--text-muted:#666;--text-faint:#aaa;
  --accent:#d42e35;--gold:#b8872a;--gold-bg:#fdf8ee;
  --green:#1a7a3f;--green-bg:#edf7f1;--yellow:#9a6200;--red:#c0392b;
  --gcal:#1a73e8;--gcal-bg:#e8f0fe;
  --r:10px;--rs:6px;--font:-apple-system,'Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
}
[data-theme="dark"]{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2233;--border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.14);--text:#e8eaf0;--text-muted:#8a90a8;--text-faint:#454d66;
  --accent:#e8474e;--gold:#d4a843;--gold-bg:rgba(212,168,67,0.1);
  --green:#2dcc6a;--green-bg:rgba(45,204,106,0.1);--yellow:#f0b429;--red:#f06060;
  --gcal:#8ab4f8;--gcal-bg:rgba(138,180,248,0.12);
  --shadow:0 1px 4px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 20px;position:sticky;top:0;z-index:50}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:.98rem;font-weight:700}
.hdr h1 em{color:var(--accent);font-style:normal}
.hdr-sub{font-size:.7rem;color:var(--text-muted);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tbtn{border:1px solid var(--border-strong);background:var(--surface2);color:var(--text-muted);padding:4px 10px;border-radius:var(--rs);cursor:pointer;font-size:.72rem;font-family:var(--font)}
.tbtn:hover{color:var(--text)}
.api-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-ok{background:#22c55e}.d-spin{background:#f59e0b;animation:blink 1s infinite}.d-err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.api-txt{font-size:.7rem;color:var(--text-muted)}

/* ── STATS ── */
.sbar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 20px}
.sbar-in{max-width:1280px;margin:0 auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sp{display:flex;align-items:center;gap:5px;font-size:.74rem;color:var(--text-muted)}
.sp b{color:var(--text);font-weight:700}
.sdot{width:7px;height:7px;border-radius:50%}
.sg{background:var(--green)}.sy{background:var(--yellow)}.sr{background:var(--red)}.sa{background:var(--accent)}

/* ── FILTERS ── */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 20px;position:sticky;top:47px;z-index:40}
.fbar-in{max-width:1280px;margin:0 auto;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.flbl{font-size:.68rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-right:4px}
.fb{padding:4px 12px;border-radius:16px;border:1px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;font-size:.74rem;font-family:var(--font);transition:all .12s}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fb.fg.active{background:var(--green);border-color:var(--green);color:#fff}
.fb.fy.active{background:var(--yellow);border-color:var(--yellow);color:#fff}
.fb.ft.active{background:var(--gcal);border-color:var(--gcal);color:#fff}
.fb.fs.active{background:var(--gold);border-color:var(--gold);color:#fff}

/* ── STANDINGS ── */
.standings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.std-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.std-card.tn-group{border-left:3px solid var(--accent)}
.std-hdr{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.78rem;font-weight:700;background:var(--surface2)}
.std-table{width:100%;border-collapse:collapse;font-size:.74rem}
.std-table th{text-align:center;font-weight:600;color:var(--text-faint);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;border-bottom:1px solid var(--border)}
.std-table th.team-col{text-align:left;padding-left:10px}
.std-table td{text-align:center;padding:6px 4px;border-bottom:1px solid var(--border)}
.std-table tr:last-child td{border-bottom:none}
.std-table td.team-cell{text-align:left;padding-left:10px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text)}
.std-table td.team-cell img{width:18px;height:13px;border-radius:2px;border:1px solid var(--border);flex-shrink:0}
.std-table td.pts{font-weight:700;color:var(--text)}
.std-row-tn{background:var(--accent);background:rgba(212,46,53,.06)}
[data-theme="dark"] .std-row-tn{background:rgba(232,71,78,.1)}
.std-rank{font-size:.68rem;color:var(--text-faint);width:20px}
.qualify-line td{border-bottom:2px solid var(--green)!important}

/* ── LAYOUT ── */
.main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.day-block{margin-bottom:22px}
.day-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:9px}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:7px}

/* ── SKELETON ── */
.skel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);height:155px;position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(128,128,128,.07),transparent);animation:shim 1.4s infinite}
@keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ── TODAY HEADER ── */
.today-hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:7px;border-bottom:1px solid var(--border);margin-bottom:9px}
.today-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.live-cnt{font-size:.64rem;background:var(--accent);color:#fff;padding:1px 7px;border-radius:10px;font-weight:700;animation:blink .8s infinite}
.rfr-btn{margin-left:auto;font-size:.68rem;color:var(--text-faint);background:none;border:none;cursor:pointer;font-family:var(--font);padding:2px 6px;border-radius:4px}
.rfr-btn:hover{color:var(--text);background:var(--surface2)}
.upd-lbl{font-size:.64rem;color:var(--text-faint)}

/* ── MATCH CARD ── */
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:border-color .14s,box-shadow .14s}
.mc:hover{border-color:var(--border-strong)}
.mc.tn-card{border-left:3px solid var(--accent)}
.mc.fin-card{border-color:var(--gold);background:var(--gold-bg)}
.mc.live-card{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,71,78,.12)}

/* top bar */
.mc-top{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 6px;border-bottom:1px solid var(--border)}
.mc-badge{padding:2px 7px;border-radius:4px;font-size:.64rem;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);letter-spacing:.02em}
.mc-badge.b-fin{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.mc-badge.b-ko{background:var(--gcal-bg);border-color:var(--gcal);color:var(--gcal)}
.mc-time-wrap{display:flex;align-items:center;gap:5px}
.mc-time{font-size:.92rem;font-weight:700;color:var(--text)}
.mc-cdot{width:7px;height:7px;border-radius:50%}
.cg{background:var(--green)}.cy{background:var(--yellow)}.cr{background:var(--red)}

/* teams */
.mc-teams{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 12px 5px;flex:1}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;flex:1}
.mc-team img{width:28px;height:21px;border-radius:3px;object-fit:cover;border:1px solid var(--border);display:block}
.flag-fb{border-radius:3px;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-faint);flex-shrink:0}
.tname{font-size:.76rem;font-weight:600;color:var(--text);text-align:center;line-height:1.2}
.mc-vs{font-size:.65rem;color:var(--text-faint);flex-shrink:0;margin-top:14px}
.tbd-block{text-align:center;padding:14px 12px 5px;flex:1;display:flex;align-items:center;justify-content:center}
.tbd-txt{font-size:.82rem;font-weight:600;color:var(--gold)}

/* ── SCORE AREA ── */
.score-area{min-height:28px;display:flex;align-items:center;justify-content:center;padding:2px 10px 4px}
/* live */
.score-live{display:flex;align-items:center;gap:7px}
.score-nums{display:flex;align-items:center;gap:5px}
.sn{font-size:1.3rem;font-weight:800;color:var(--text);line-height:1;min-width:16px;text-align:center}
.s-sep{font-size:.9rem;color:var(--text-faint);font-weight:300}
.live-pill{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.03em}
.pulse{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse-a 1.1s ease-in-out infinite}
@keyframes pulse-a{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
/* final */
.score-final{display:flex;align-items:center;gap:7px}
.ft-pill{font-size:.62rem;color:var(--text-faint);border:1px solid var(--border);padding:1px 6px;border-radius:10px}
/* HT indicator */
.ht-pill{display:inline-flex;align-items:center;gap:4px;background:var(--yellow);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:20px}

/* meta */
.mc-meta{padding:2px 10px 7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mc-venue{font-size:.66rem;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mc-suit{font-size:.66rem;flex-shrink:0}
.sc-green{color:var(--green)}.sc-yellow{color:var(--yellow)}.sc-red{color:var(--red)}

/* cal buttons */
.mc-cal{border-top:1px solid var(--border);padding:6px 8px;display:flex;gap:6px}
.cbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 6px;border-radius:var(--rs);font-size:.7rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;font-family:var(--font);transition:opacity .12s,transform .1s;white-space:nowrap}
.cbtn:hover{opacity:.8;transform:translateY(-1px)}
.cbtn:active{transform:translateY(0)}
.c-gcal{background:var(--gcal-bg);color:var(--gcal);border:1px solid transparent}
.c-ics{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.cbtn svg{width:12px;height:12px;flex-shrink:0}

.msg{text-align:center;padding:40px;color:var(--text-faint);font-size:.9rem}

/* ── MATCH SIDE PANEL ── */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;opacity:0;visibility:hidden;transition:opacity .2s}
.panel-overlay.open{opacity:1;visibility:visible}
.match-panel{
  position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;
  background:var(--surface);border-left:1px solid var(--border);
  box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:91;
  transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;
}
.match-panel.open{transform:translateX(0)}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-title{font-size:.9rem;font-weight:700}
.panel-close{background:var(--surface2);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;cursor:pointer;color:var(--text-muted);font-size:.85rem;flex-shrink:0}
.panel-close:hover{color:var(--text)}
.panel-body{padding:14px 16px;overflow-y:auto;flex:1}

/* panel score header */
.pn-score{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 18px}
.pn-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.pn-team img{width:40px;height:30px;border-radius:4px;border:1px solid var(--border);object-fit:cover}
.pn-team .pn-tname{font-size:.8rem;font-weight:700;text-align:center}
.pn-score-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.pn-score-nums{font-size:1.8rem;font-weight:800;display:flex;align-items:center;gap:8px}
.pn-status{font-size:.68rem;color:var(--text-faint)}

/* panel sections */
.pn-section{margin-bottom:18px}
.pn-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}

/* events timeline */
.pn-event{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:.78rem}
.pn-event-min{font-weight:700;color:var(--text-muted);min-width:32px;flex-shrink:0;font-size:.72rem}
.pn-event-icon{flex-shrink:0;width:16px;text-align:center}
.pn-event-text{flex:1;color:var(--text)}
.pn-event-text .sub{color:var(--text-faint);font-size:.7rem}
.pn-event.away-event{flex-direction:row-reverse;text-align:right}
.pn-event.away-event .pn-event-text{text-align:right}

/* stats bars */
.pn-stat-row{margin-bottom:10px}
.pn-stat-labels{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;margin-bottom:4px}
.pn-stat-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.pn-stat-bar .home-bar{background:var(--accent)}
.pn-stat-bar .away-bar{background:var(--gcal)}
.pn-stat-name{text-align:center;font-size:.66rem;color:var(--text-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

/* lineups */
.pn-lineup-cols{display:flex;gap:10px}
.pn-lineup-col{flex:1;min-width:0}
.pn-lineup-team{font-size:.72rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pn-lineup-team img{width:18px;height:13px;border-radius:2px;border:1px solid var(--border)}
.pn-player{font-size:.7rem;color:var(--text-muted);padding:2px 0;display:flex;gap:6px}
.pn-player .num{color:var(--text-faint);min-width:18px;text-align:right}

@media(max-width:480px){
  .hdr{padding:10px 14px}
  .fbar{top:43px}
  .mc-team img,.flag-fb{width:22px!important;height:16px!important}
  .sn{font-size:1.1rem}
  .match-panel{width:100vw}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div>
      <h1>🏆 FIFA World Cup 2026 <em>· Tunisia Time</em></h1>
      <p class="hdr-sub" id="hdr-sub">Loading schedule…</p>
    </div>
    <div class="hdr-right">
      <span class="api-dot d-spin" id="apiDot"></span>
      <span class="api-txt" id="apiTxt">Connecting…</span>
      <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </div>
  </div>
</header>

<div class="sbar">
  <div class="sbar-in">
    <div class="sp"><span class="sdot sg"></span><b id="cnt-g">–</b> good time</div>
    <div class="sp"><span class="sdot sy"></span><b id="cnt-y">–</b> borderline</div>
    <div class="sp"><span class="sdot sr"></span><b id="cnt-r">–</b> rough</div>
    <div class="sp"><span class="sdot sa"></span><b id="cnt-tn">–</b> 🇹🇳 Tunisia</div>
    <div class="sp"><b id="cnt-tot">–</b> matches total</div>
  </div>
</div>

<div class="fbar">
  <div class="fbar-in">
    <span class="flbl">Filter</span>
    <button class="fb active" data-f="all">All</button>
    <button class="fb" data-f="tn">🇹🇳 Tunisia</button>
    <button class="fb fg" data-f="green">🟢 Good hours</button>
    <button class="fb fy" data-f="yellow">🟡 Borderline</button>
    <button class="fb ft" data-f="today" id="btn-today">📅 Today</button>
    <button class="fb fs" data-f="standings" id="btn-standings">📊 Standings</button>
  </div>
</div>

<main class="main" id="schedule">
  <div class="day-block">
    <div style="height:10px;width:120px;background:var(--border);border-radius:4px;margin-bottom:12px"></div>
    <div class="day-grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </div>
</main>

<div class="panel-overlay" id="panelOverlay" onclick="closeMatchPanel()"></div>
<aside class="match-panel" id="matchPanel">
  <div class="panel-hdr">
    <span class="panel-title" id="panelTitle">Match details</span>
    <button class="panel-close" onclick="closeMatchPanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<script>
'use strict';

// ──────────────────────────────────────────
// CONFIG
// ──────────────────────────────────────────
const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world';
const TZ = 1; // Tunisia = UTC+1

// flagcdn ISO2 map
const FL = {"Mexico":"mx","South Africa":"za","South Korea":"kr","Korea Republic":"kr","Czech Republic":"cz","Czechia":"cz","Canada":"ca","Bosnia-Herzegovina":"ba","Bosnia and Herzegovina":"ba","United States":"us","USA":"us","Paraguay":"py","Qatar":"qa","Switzerland":"ch","Brazil":"br","Morocco":"ma","Haiti":"ht","Scotland":"gb-sct","Australia":"au","Turkey":"tr","Türkiye":"tr","Germany":"de","Curaçao":"cw","Curacao":"cw","Netherlands":"nl","Japan":"jp","Côte d'Ivoire":"ci","Ivory Coast":"ci","Ecuador":"ec","Sweden":"se","Tunisia":"tn","Spain":"es","Cape Verde":"cv","Cabo Verde":"cv","Belgium":"be","Egypt":"eg","Saudi Arabia":"sa","Uruguay":"uy","Iran":"ir","New Zealand":"nz","France":"fr","Senegal":"sn","Iraq":"iq","Norway":"no","Argentina":"ar","Algeria":"dz","Austria":"at","Jordan":"jo","Ghana":"gh","Panama":"pa","England":"gb-eng","Croatia":"hr","Portugal":"pt","DR Congo":"cd","Congo DR":"cd","Uzbekistan":"uz","Colombia":"co","Wales":"gb-wls","Serbia":"rs","Denmark":"dk","Poland":"pl","Ukraine":"ua"};

// ──────────────────────────────────────────
// STATE
// ──────────────────────────────────────────
let MATCHES = [];      // [{home,away,utcDate,timeStr,dateStr,venue,round,suit,lk,isFinal}]
let SCORES  = {};      // lk → {status,homeScore,awayScore,clock,isPaused}
let STANDINGS = null;  // parsed group standings
let lastUpdate = null;
let refreshTimer = null;
let activeFilter = 'all';

// ──────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────
function tunTime(utc) {
  const d = new Date(utc);
  const h = (d.getUTCHours() + TZ) % 24;
  const m = d.getUTCMinutes();
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function tunDate(utc) {
  const d = new Date(new Date(utc).getTime() + TZ * 3600000);
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
}
function todayTun() {
  return tunDate(Date.now());
}
function suit(utc) {
  const h = (new Date(utc).getUTCHours() + TZ) % 24;
  if (h >= 15 && h <= 23) return {cls:'green', label:'Good time', icon:'🟢'};
  if (h === 0 || (h >= 12 && h < 15)) return {cls:'yellow', label:'Borderline', icon:'🟡'};
  return {cls:'red', label:'Rough hours', icon:'🔴'};
}
function isTN(m) { return /tunisia/i.test(m.home + m.away); }
function lk(h, a) { return (h + '|' + a).toLowerCase(); }

function flagImg(name) {
  const code = FL[name];
  if (!code) return `<span class="flag-fb" style="width:28px;height:21px">${name.slice(0,2).toUpperCase()}</span>`;
  const ini = name.slice(0,2).toUpperCase();
  return `<img src="https://flagcdn.com/w40/${code}.webp" width="28" height="21" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flag-fb',textContent:'${ini}',style:'width:28px;height:21px'}))">`;
}

function gcalUrl(m) {
  const s = new Date(m.utcDate).toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const e = new Date(new Date(m.utcDate).getTime()+7200000).toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const t = m.isFinal ? '🏆 WC 2026 Final' : `WC 2026: ${m.home} vs ${m.away}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t)}&dates=${s}/${e}&location=${encodeURIComponent(m.venue)}`;
}

function dlIcs(idx) {
  const m = MATCHES[idx];
  const fmt = u => new Date(new Date(u).getTime()+TZ*3600000).toISOString().replace(/[-:.Z]/g,'').slice(0,15);
  const t = m.isFinal ? '🏆 FIFA World Cup 2026 Final' : `FIFA WC 2026: ${m.home} vs ${m.away}`;
  const blob = new Blob([[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WC2026//EN','BEGIN:VEVENT',
    `UID:wc26-${idx}-${fmt(m.utcDate)}@tn`,
    `DTSTART;TZID=Africa/Tunis:${fmt(m.utcDate)}`,
    `DTEND;TZID=Africa/Tunis:${fmt(new Date(new Date(m.utcDate).getTime()+7200000))}`,
    `SUMMARY:${t}`,`LOCATION:${m.venue}`,
    `DESCRIPTION:${m.round} | ${m.suit.icon} ${m.suit.label}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n')], {type:'text/calendar'});
  Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:t.replace(/[^\w]/g,'_')+'.ics'}).click();
}

// ──────────────────────────────────────────
// ESPN FETCH – FULL SCHEDULE
// ──────────────────────────────────────────
async function fetchSchedule() {
  setStatus('loading','Loading…');
  try {
    // Fetch all WC dates in one call
    const r = await fetch(`${ESPN_BASE}/scoreboard?dates=20260611-20260719&limit=110`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const events = data.events || [];
    if (!events.length) throw new Error('No events returned');
    parseSchedule(events);
    setStatus('ok', `ESPN · ${MATCHES.length} matches`);
    document.getElementById('hdr-sub').textContent = `All times UTC+1 · ${MATCHES.length} matches · auto-refresh 60s`;
  } catch(err) {
    console.warn('ESPN schedule failed:', err.message, '→ static fallback');
    useStaticFallback();
    setStatus('err','Fallback schedule · ESPN blocked server-side');
  }
}

function parseSchedule(events) {
  MATCHES = events.map(ev => {
    const comp   = ev.competitions?.[0] || {};
    const comps  = comp.competitors || [];
    const home   = comps.find(c => c.homeAway === 'home') || comps[0] || {};
    const away   = comps.find(c => c.homeAway === 'away') || comps[1] || {};
    const hName  = home.team?.displayName || 'TBD';
    const aName  = away.team?.displayName || 'TBD';
    const utcDate = ev.date;
    const s = suit(utcDate);
    // Round label: try notes, then season type
    const note = comp.notes?.[0]?.headline || '';
    const round = note || comp.type?.abbreviation || ev.season?.type?.name || 'Group Stage';
    const isF = /\bfinal\b/i.test(round) && !/semi|quarter/i.test(round);
    const isKO = /round|quarter|semi|final/i.test(round);
    return {
      id: ev.id,
      home: hName, away: aName,
      utcDate,
      timeStr: tunTime(utcDate),
      dateStr: tunDate(utcDate),
      venue: comp.venue?.fullName || 'USA',
      round, suit: s, lk: lk(hName, aName),
      isFinal: isF, isKO,
      // Absorb scores from schedule response too
      homeScore: home.score ?? null,
      awayScore: away.score ?? null,
      status: comp.status?.type?.name || 'STATUS_SCHEDULED',
      clock: comp.status?.displayClock || '',
    };
  }).sort((a,b) => new Date(a.utcDate) - new Date(b.utcDate));

  // Pre-populate SCORES from schedule response
  MATCHES.forEach(m => {
    if (m.status !== 'STATUS_SCHEDULED' && m.homeScore !== null) {
      SCORES[m.lk] = {
        status: m.status,
        homeScore: m.homeScore,
        awayScore: m.awayScore,
        clock: m.clock,
        isPaused: m.status === 'STATUS_HALFTIME',
      };
    }
  });

  updateStats();
  renderCurrent();
}

async function fetchLive() {
  const d = new Date();
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  try {
    const r = await fetch(`${ESPN_BASE}/scoreboard?dates=${ymd}`);
    if (!r.ok) return;
    const data = await r.json();
    (data.events || []).forEach(ev => {
      const comp  = ev.competitions?.[0] || {};
      const comps = comp.competitors || [];
      const home  = comps.find(c => c.homeAway === 'home') || comps[0] || {};
      const away  = comps.find(c => c.homeAway === 'away') || comps[1] || {};
      const key   = lk(home.team?.displayName || '', away.team?.displayName || '');
      const st    = comp.status?.type?.name || '';
      SCORES[key] = {
        status:    st,
        homeScore: home.score ?? '',
        awayScore: away.score ?? '',
        clock:     comp.status?.displayClock || '',
        isPaused:  st === 'STATUS_HALFTIME',
      };
    });
    lastUpdate = new Date();

    updateTodayHeader();
    updateLiveBtnLabel();
  } catch(e) { /* silent */ }

// ESPN FETCH – STANDINGS
// ──────────────────────────────────────────
async function fetchStandings() {
  if (STANDINGS) { renderStandings(); return; } // cached
  const el = document.getElementById('schedule');
  el.innerHTML = '<p class="msg">Loading standings…</p>';
  try {
    const r = await fetch('https://site.api.espn.com/apis/v2/sports/soccer/fifa.world/standings');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const groups = parseStandings(data);
    if (!groups.length) throw new Error('No standings data');
    STANDINGS = groups;
    renderStandings();
  } catch(err) {
    console.warn('Standings fetch failed:', err.message);
    el.innerHTML = `<p class="msg">Standings not available yet — they appear once group matches have been played.<br><br>Try the <strong>All</strong> or <strong>Today</strong> tabs for the schedule.</p>`;
  }
}

// Parse ESPN standings response into [{name, rows:[{team,played,win,draw,loss,gf,ga,gd,pts}]}]
function parseStandings(data) {
  // ESPN nests groups under data.children[]
  const children = data.children || data.standings?.children || [];
  const groups = [];
  children.forEach(child => {
    const groupName = child.name || child.abbreviation || 'Group';
    const entries = child.standings?.entries || [];
    if (!entries.length) return;
    const rows = entries.map(entry => {
      const team = entry.team?.displayName || entry.team?.name || 'TBD';
      const statByName = {};
      (entry.stats || []).forEach(s => { statByName[s.name || s.abbreviation] = s.value ?? s.displayValue; });
      return {
        team,
        played: statByName.gamesPlayed ?? statByName.GP ?? 0,
        win:    statByName.wins ?? statByName.W ?? 0,
        draw:   statByName.ties ?? statByName.draws ?? statByName.D ?? 0,
        loss:   statByName.losses ?? statByName.L ?? 0,
        gf:     statByName.pointsFor ?? statByName.goalsFor ?? statByName.GF ?? 0,
        ga:     statByName.pointsAgainst ?? statByName.goalsAgainst ?? statByName.GA ?? 0,
        gd:     statByName.pointDifferential ?? statByName.goalDifferential ?? statByName.GD ?? 0,
        pts:    statByName.points ?? statByName.PTS ?? 0,
      };
    });
    // Defensive sort: points desc, then GD desc, then GF desc
    rows.sort((a,b) => (b.pts - a.pts) || (b.gd - a.gd) || (b.gf - a.gf));
    groups.push({name: groupName, rows});
  });
  // Sort groups alphabetically (Group A, B, C...)
  groups.sort((a,b) => a.name.localeCompare(b.name));
  return groups;
}

function renderStandings() {
  const el = document.getElementById('schedule');
  if (!STANDINGS || !STANDINGS.length) {
    el.innerHTML = '<p class="msg">Standings not available yet.</p>';
    return;
  }
  let html = '<div class="standings-grid">';
  STANDINGS.forEach(group => {
    const hasTunisia = group.rows.some(r => /tunisia/i.test(r.team));
    html += `<div class="std-card${hasTunisia ? ' tn-group' : ''}">
      <div class="std-hdr">${hasTunisia ? '🇹🇳 ' : ''}${group.name}</div>
      <table class="std-table">
        <thead><tr>
          <th></th><th class="team-col">Team</th>
          <th title="Played">P</th><th title="Won">W</th><th title="Drawn">D</th><th title="Lost">L</th>
          <th title="Goal Diff">GD</th><th title="Points">Pts</th>
        </tr></thead>
        <tbody>`;
    group.rows.forEach((r, i) => {
      const isTn = /tunisia/i.test(r.team);
      const qualLine = i === 1 ? ' qualify-line' : ''; // top 2 typically qualify
      html += `<tr class="${isTn ? 'std-row-tn' : ''}${qualLine}">
        <td class="std-rank">${i+1}</td>
        <td class="team-cell">${flagImg(r.team)}<span>${r.team}</span></td>
        <td>${r.played}</td><td>${r.win}</td><td>${r.draw}</td><td>${r.loss}</td>
        <td>${r.gd > 0 ? '+'+r.gd : r.gd}</td>
        <td class="pts">${r.pts}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

async function openMatchPanel(idx) {
  const m = MATCHES[idx];
  const overlay = document.getElementById('panelOverlay');
  const panel = document.getElementById('matchPanel');
  const body = document.getElementById('panelBody');
  const title = document.getElementById('panelTitle');

  panel.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Score header (always available from MATCHES/SCORES)
  const sc = SCORES[m.lk] || {};
  const homeScore = sc.homeScore ?? '–';
  const awayScore = sc.awayScore ?? '–';
  let statusTxt = m.timeStr + ' · ' + m.dateStr;
  if (sc.status === 'STATUS_IN_PROGRESS') statusTxt = `LIVE · ${sc.clock || ''}`;
  else if (sc.status === 'STATUS_HALFTIME') statusTxt = 'Half time';
  else if (sc.status === 'STATUS_FINAL') statusTxt = 'Full time';

  const headerHtml = (m.home === 'TBD')
    ? `<div class="pn-score"><div class="pn-status" style="font-size:.9rem;font-weight:600">${m.round}</div></div>`
    : `<div class="pn-score">
        <div class="pn-team">${flagImg(m.home).replace('width="28" height="21"','width="40" height="30"')}<span class="pn-tname">${m.home}</span></div>
        <div class="pn-score-mid">
          <div class="pn-score-nums"><span>${homeScore}</span><span style="color:var(--text-faint);font-weight:400">–</span><span>${awayScore}</span></div>
          <div class="pn-status">${statusTxt}</div>
        </div>
        <div class="pn-team">${flagImg(m.away).replace('width="28" height="21"','width="40" height="30"')}<span class="pn-tname">${m.away}</span></div>
      </div>
      <div class="pn-section">
        <div class="pn-section-title">Match info</div>
        <div style="font-size:.78rem;color:var(--text-muted);line-height:1.6">
          ${m.round}<br>${m.venue}<br>${m.suit.icon} ${m.suit.label} (${m.timeStr} Tunisia time)
        </div>
      </div>`;

  body.innerHTML = headerHtml + '<div class="pn-section"><p class="msg" style="padding:20px 0">Loading match details…</p></div>';

  if (!m.id) {
    body.innerHTML = headerHtml + '<div class="pn-section"><p style="font-size:.78rem;color:var(--text-faint)">No further details available for this fixture yet.</p></div>';
    return;
  }

  // Fetch full summary
  try {
    const r = await fetch(`${ESPN_BASE}/summary?event=${m.id}`);
    if (!r.ok) throw new Error('HTTP '+r.status);

    body.innerHTML = headerHtml + buildPanelDetails(data, m);
  } catch(e) {
    body.innerHTML = headerHtml + `<div class="pn-section"><p style="font-size:.78rem;color:var(--text-faint)">Match details aren't available right now.</p></div>`;
  }
}

function closeMatchPanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('matchPanel').classList.remove('open');
  document.body.style.overflow = '';
}

function buildPanelDetails(data, m) {
  let html = '';

  // ── Events timeline (goals, cards, subs) ──
  const keyEvents = (data.keyEvents || []).filter(e => {
    const t = (e.type?.text || '').toLowerCase();
    return t.includes('goal') || t.includes('card') || t.includes('substitution') || t.includes('penalty');
  });
  if (keyEvents.length) {
    html += `<div class="pn-section"><div class="pn-section-title">Match events</div>`;
    keyEvents.forEach(e => {
      const isHome = e.team?.id && data.boxscore?.teams?.[0]?.team?.id === e.team.id;
      const type = (e.type?.text || '').toLowerCase();
      let icon = '⚽';
      if (type.includes('yellow')) icon = '🟨';
      else if (type.includes('red')) icon = '🟥';
      else if (type.includes('substitution')) icon = '🔄';
      else if (type.includes('penalty') && type.includes('miss')) icon = '❌';
      const athlete = e.athletesInvolved?.[0]?.displayName || e.participants?.[0]?.athlete?.displayName || '';
      const assist = e.athletesInvolved?.[1]?.displayName ? `<div class="sub">Assist: ${e.athletesInvolved[1].displayName}</div>` : '';
      const min = e.clock?.displayValue || '';
      html += `<div class="pn-event${isHome ? '' : ' away-event'}">
        <span class="pn-event-min">${min}</span>
        <span class="pn-event-icon">${icon}</span>
        <span class="pn-event-text">${athlete}${assist}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // ── Team stats (possession, shots, etc) ──
  const teamStats = data.boxscore?.teams;
  if (teamStats && teamStats.length === 2) {
    const home = teamStats.find(t => t.homeAway === 'home') || teamStats[0];
    const away = teamStats.find(t => t.homeAway === 'away') || teamStats[1];
    const statMap = {};
    (home.statistics || []).forEach(s => { statMap[s.name] = statMap[s.name] || {}; statMap[s.name].home = s.displayValue; });
    (away.statistics || []).forEach(s => { statMap[s.name] = statMap[s.name] || {}; statMap[s.name].away = s.displayValue; });

    const wanted = [
      ['possessionPct','Possession'],
      ['shotsTotal','Shots'],
      ['shotsOnTarget','Shots on Target'],
      ['totalCorners','Corners'],
      ['foulsCommitted','Fouls'],
      ['yellowCards','Yellow Cards'],
    ];
    const rows = wanted.filter(([key]) => statMap[key]);
    if (rows.length) {
      html += `<div class="pn-section"><div class="pn-section-title">Match stats</div>`;
      rows.forEach(([key,label]) => {
        const hv = parseFloat(statMap[key].home) || 0;
        const av = parseFloat(statMap[key].away) || 0;
        const total = hv + av || 1;
        const hp = (hv/total*100).toFixed(0);
        const ap = (av/total*100).toFixed(0);
        html += `<div class="pn-stat-row">
          <div class="pn-stat-labels"><span>${statMap[key].home ?? '–'}</span><span>${statMap[key].away ?? '–'}</span></div>
          <div class="pn-stat-bar"><div class="home-bar" style="width:${hp}%"></div><div class="away-bar" style="width:${ap}%"></div></div>
          <div class="pn-stat-name">${label}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  // ── Lineups ──
  const lineups = data.rosters;
  if (lineups && lineups.length === 2) {
    const home = lineups.find(l => l.homeAway === 'home') || lineups[0];
    const away = lineups.find(l => l.homeAway === 'away') || lineups[1];
    const starters = roster => (roster.roster || []).filter(p => p.starter).slice(0,11);
    const hs = starters(home), as = starters(away);
    if (hs.length || as.length) {
      html += `<div class="pn-section"><div class="pn-section-title">Starting XI</div>
        <div class="pn-lineup-cols">
          <div class="pn-lineup-col">
            <div class="pn-lineup-team">${flagImg(m.home)}<span>${m.home}</span></div>
            ${hs.map(p => `<div class="pn-player"><span class="num">${p.jersey||''}</span><span>${p.athlete?.shortName || p.athlete?.displayName || ''}</span></div>`).join('')}
          </div>
          <div class="pn-lineup-col">
            <div class="pn-lineup-team">${flagImg(m.away)}<span>${m.away}</span></div>
            ${as.map(p => `<div class="pn-player"><span class="num">${p.jersey||''}</span><span>${p.athlete?.shortName || p.athlete?.displayName || ''}</span></div>`).join('')}
          </div>
        </div>
      </div>`;
    }
  }

  if (!html) {
    html = `<div class="pn-section"><p style="font-size:.78rem;color:var(--text-faint)">No additional details available yet for this match. Check back closer to or during kickoff.</p></div>`;
  }

  return html;
}

// ──────────────────────────────────────────
// SCORE HTML
// ──────────────────────────────────────────
function scoreHtml(key) {
  const s = SCORES[key];
  if (!s || s.status === 'STATUS_SCHEDULED' || !s.status) return '';

  const nums = `<div class="score-nums">
    <span class="sn">${s.homeScore}</span>
    <span class="s-sep">–</span>
    <span class="sn">${s.awayScore}</span>
  </div>`;

  if (s.status === 'STATUS_IN_PROGRESS') {
    return `<div class="score-area"><div class="score-live">
      ${nums}
      <span class="live-pill"><span class="pulse"></span>${s.clock || 'LIVE'}</span>
    </div></div>`;
  }
  if (s.status === 'STATUS_HALFTIME') {
    return `<div class="score-area"><div class="score-live">
      ${nums}
      <span class="ht-pill">HT</span>
    </div></div>`;
  }
  if (s.status === 'STATUS_FINAL' || s.status === 'STATUS_FULL_TIME') {
    return `<div class="score-area"><div class="score-final">
      ${nums}
      <span class="ft-pill">FT</span>
    </div></div>`;
  }
  // Fallback for any other "in-play" status
  if (s.homeScore !== '' && s.awayScore !== '') {
    return `<div class="score-area"><div class="score-live">
      ${nums}
      <span class="live-pill"><span class="pulse"></span>${s.clock || 'LIVE'}</span>
    </div></div>`;
  }
  return '';
}

// Patch scores into existing DOM without full re-render
function patchScoreBadges() {
  document.querySelectorAll('.mc[data-lk]').forEach(card => {
    const key = card.dataset.lk;
    const sa  = card.querySelector('.score-area-wrap');
    if (sa) sa.innerHTML = scoreHtml(key);
    const s = SCORES[key];
    const isLive = s && s.status === 'STATUS_IN_PROGRESS';
    const isHT   = s && s.status === 'STATUS_HALFTIME';
    card.classList.toggle('live-card', isLive || isHT);
  });
}

// ──────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────
function renderCurrent() { render(activeFilter); }

function render(filter) {
  activeFilter = filter;
  const el = document.getElementById('schedule');

  if (filter === 'standings') { fetchStandings(); return; }

  let items = MATCHES.map((m,i) => ({m,i}));

  if (filter === 'today') {
    const today = todayTun();
    items = items.filter(({m}) => m.dateStr === today);

    if (!items.length) {
      el.innerHTML = '<p class="msg">No matches today.</p>';
      return;
    }

    const liveCount = items.filter(({m}) => {
      const s = SCORES[m.lk];
      return s && (s.status === 'STATUS_IN_PROGRESS' || s.status === 'STATUS_HALFTIME');
    }).length;

    let html = `<div class="day-block">
      <div class="today-hdr">
        <span class="today-lbl">Today · ${today}</span>
        ${liveCount ? `<span class="live-cnt" id="live-cnt">${liveCount} LIVE</span>` : '<span id="live-cnt"></span>'}
        <button class="rfr-btn" onclick="fetchLive()">↻ Refresh</button>
        <span class="upd-lbl" id="upd-lbl">${lastUpdate ? 'Updated ' + lastUpdate.toLocaleTimeString() : ''}</span>
      </div>
      <div class="day-grid">`;
    items.forEach(({m,i}) => { html += buildCard(m,i); });
    html += '</div></div>';
    el.innerHTML = html;
    return;
  }

  if (filter === 'tn')     items = items.filter(({m}) => isTN(m));
  if (filter === 'green')  items = items.filter(({m}) => m.suit.cls === 'green');
  if (filter === 'yellow') items = items.filter(({m}) => m.suit.cls === 'yellow');

  if (!items.length) { el.innerHTML = '<p class="msg">No matches for this filter.</p>'; return; }

  const byDate = {};
  items.forEach(({m,i}) => {
    (byDate[m.dateStr] = byDate[m.dateStr] || []).push({m,i});
  });

  let html = '';
  for (const [date, list] of Object.entries(byDate)) {
    html += `<div class="day-block"><div class="day-lbl">${date}</div><div class="day-grid">`;
    list.forEach(({m,i}) => { html += buildCard(m,i); });
    html += '</div></div>';
  }
  el.innerHTML = html;
}

// ──────────────────────────────────────────
// TODAY HEADER UPDATE (no full re-render)
// ──────────────────────────────────────────
function updateTodayHeader() {
  if (activeFilter !== 'today') return;
  const upd = document.getElementById('upd-lbl');
  if (upd && lastUpdate) upd.textContent = 'Updated ' + lastUpdate.toLocaleTimeString();
  updateLiveCntBadge();
}

function updateLiveCntBadge() {
  const el = document.getElementById('live-cnt');
  if (!el) return;
  const today = todayTun();
  const count = MATCHES.filter(m => m.dateStr === today).filter(m => {
    const s = SCORES[m.lk]; return s && (s.status==='STATUS_IN_PROGRESS'||s.status==='STATUS_HALFTIME');
  }).length;
  el.textContent = count ? count + ' LIVE' : '';
  el.style.display = count ? '' : 'none';
}

function updateLiveBtnLabel() {
  const today = todayTun();
  const liveCount = MATCHES.filter(m => m.dateStr === today).filter(m => {
    const s = SCORES[m.lk]; return s && (s.status==='STATUS_IN_PROGRESS'||s.status==='STATUS_HALFTIME');
  }).length;
  document.getElementById('btn-today').textContent = liveCount ? `📅 Today · ${liveCount} LIVE` : '📅 Today';
}

// ──────────────────────────────────────────
// STATS
// ──────────────────────────────────────────
function updateStats() {
  let g=0,y=0,r=0,tn=0;
  MATCHES.forEach(m => {
    if (m.suit.cls==='green') g++; else if (m.suit.cls==='yellow') y++; else r++;
    if (isTN(m)) tn++;
  });
  document.getElementById('cnt-g').textContent = g;
  document.getElementById('cnt-y').textContent = y;
  document.getElementById('cnt-r').textContent = r;
  document.getElementById('cnt-tn').textContent = tn;
  document.getElementById('cnt-tot').textContent = MATCHES.length;
}
