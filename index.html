<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 – Tunisia Time</title>
<style>
:root{
  --bg:#f2f1ed;--surface:#fff;--surface2:#eceae5;--border:rgba(0,0,0,0.08);
  --border-strong:rgba(0,0,0,0.15);--text:#111;--text-muted:#666;--text-faint:#aaa;
  --accent:#d42e35;--gold:#b8872a;--gold-bg:#fdf8ee;
  --green:#1a7a3f;--green-bg:#edf7f1;--yellow:#9a6200;--yellow-bg:#fdf6e3;
  --red:#c0392b;--gcal:#1a73e8;--gcal-bg:#e8f0fe;
  --r:10px;--rs:6px;--font:-apple-system,'Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 1px 2px rgba(0,0,0,0.04);
}
[data-theme="dark"]{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2233;--border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.14);--text:#e8eaf0;--text-muted:#8a90a8;--text-faint:#454d66;
  --accent:#e8474e;--gold:#d4a843;--gold-bg:rgba(212,168,67,0.1);
  --green:#2dcc6a;--green-bg:rgba(45,204,106,0.1);--yellow:#f0b429;--yellow-bg:rgba(240,180,41,0.1);
  --red:#f06060;--gcal:#8ab4f8;--gcal-bg:rgba(138,180,248,0.12);
  --shadow:0 1px 4px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:50}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:1rem;font-weight:700}
.hdr h1 em{color:var(--accent);font-style:normal}
.hdr-sub{font-size:.72rem;color:var(--text-muted);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px}
.tbtn{border:1px solid var(--border-strong);background:var(--surface2);color:var(--text-muted);padding:4px 10px;border-radius:var(--rs);cursor:pointer;font-size:.72rem;font-family:var(--font)}
.tbtn:hover{color:var(--text)}
.api-status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--green)}.dot-loading{background:var(--yellow);animation:blink 1s infinite}
.dot-err{background:var(--red)}.dot-off{background:var(--text-faint)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.status-txt{font-size:.7rem;color:var(--text-muted)}

/* STATS */
.sbar{background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 20px}
.sbar-in{max-width:1280px;margin:0 auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sp{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--text-muted)}
.sp b{color:var(--text);font-weight:700}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sg{background:var(--green)}.sy{background:var(--yellow)}.sr{background:var(--red)}.sa{background:var(--accent)}

/* FILTERS */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 20px;position:sticky;top:49px;z-index:40}
.fbar-in{max-width:1280px;margin:0 auto;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.flbl{font-size:.68rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-right:4px}
.fb{padding:4px 12px;border-radius:16px;border:1px solid var(--border-strong);background:transparent;color:var(--text-muted);cursor:pointer;font-size:.75rem;font-family:var(--font);transition:all .12s}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.fb.fg.active{background:var(--green);border-color:var(--green);color:#fff}
.fb.fy.active{background:var(--yellow);border-color:var(--yellow);color:#fff}
.fb.ft.active{background:var(--gcal);border-color:var(--gcal);color:#fff}

/* MAIN */
.main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}

/* SKELETON LOADER */
.skeleton-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-bottom:24px}
.skel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);height:160px;overflow:hidden;position:relative}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(128,128,128,.08) 50%,transparent 100%);animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* DAY SECTION */
.day-block{margin-bottom:24px}
.day-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}

/* TODAY SECTION */
.today-hdr{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap}
.today-lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.live-count{font-size:.65rem;background:var(--accent);color:#fff;padding:1px 7px;border-radius:10px;font-weight:700}
.refresh-btn{margin-left:auto;font-size:.68rem;color:var(--text-faint);background:none;border:none;cursor:pointer;font-family:var(--font);padding:2px 6px;border-radius:4px}
.refresh-btn:hover{color:var(--text);background:var(--surface2)}
.upd-time{font-size:.65rem;color:var(--text-faint)}

/* MATCH CARD */
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:border-color .14s}
.mc:hover{border-color:var(--border-strong)}
.mc.tn{border-left:3px solid var(--accent)}
.mc.fin-match{border-color:var(--gold);background:var(--gold-bg)}
.mc.live-now{border-color:var(--accent);box-shadow:0 0 0 1px rgba(232,71,78,.15)}

/* card top */
.mc-top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;border-bottom:1px solid var(--border)}
.mc-badge{padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted)}
.mc-badge.fin-b{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.mc-badge.ko-b{background:rgba(138,180,248,.12);border-color:var(--gcal);color:var(--gcal)}
.mc-time-wrap{display:flex;align-items:center;gap:6px}
.mc-time{font-size:.95rem;font-weight:700;color:var(--text)}
.mc-cdot{width:7px;height:7px;border-radius:50%}
.dg{background:var(--green)}.dy{background:var(--yellow)}.dr{background:var(--red)}

/* teams */
.mc-teams{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 12px 6px;flex:1}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;flex:1}
.mc-team img{width:28px;height:21px;border-radius:3px;object-fit:cover;border:1px solid var(--border);display:block}
.flag-fb{border-radius:3px;background:var(--surface2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-faint)}
.tname{font-size:.78rem;font-weight:600;color:var(--text);text-align:center;line-height:1.2;word-break:break-word}
.mc-vs{font-size:.68rem;color:var(--text-faint);flex-shrink:0;padding-top:14px}
.tbd-teams{text-align:center;padding:14px 12px 6px;flex:1;display:flex;align-items:center;justify-content:center}
.tbd-lbl{font-size:.82rem;font-weight:600;color:var(--text-muted)}

/* scores */
.score-wrap{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px 2px;min-height:22px}
.score-n{font-size:1.1rem;font-weight:700;color:var(--text)}
.score-sep{color:var(--text-faint);font-size:.8rem}
.live-badge{display:inline-flex;align-items:center;gap:3px;background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:4px}
.live-pulse{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.score-ft{font-size:.62rem;color:var(--text-faint);text-align:center;padding-bottom:2px}

/* meta */
.mc-meta{padding:2px 10px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mc-venue{font-size:.67rem;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mc-suit{font-size:.67rem;flex-shrink:0}
.sc-green{color:var(--green)}.sc-yellow{color:var(--yellow)}.sc-red{color:var(--red)}

/* cal buttons */
.mc-cal{border-top:1px solid var(--border);padding:7px 8px;display:flex;gap:6px}
.cbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:5px 6px;border-radius:var(--rs);font-size:.7rem;font-weight:600;cursor:pointer;text-decoration:none;border:none;font-family:var(--font);transition:opacity .12s,transform .1s;white-space:nowrap}
.cbtn:hover{opacity:.82;transform:translateY(-1px)}
.cbtn:active{transform:translateY(0)}
.cg{background:var(--gcal-bg);color:var(--gcal);border:1px solid transparent}
.ci{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.cbtn svg{width:12px;height:12px;flex-shrink:0}

/* empty / error */
.msg{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:.9rem;grid-column:1/-1}
.err-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:20px;font-size:.82rem;color:var(--text-muted)}
.err-box strong{color:var(--red)}

@media(max-width:480px){
  .hdr{padding:10px 14px}.fbar{top:44px}
  .mc-team img,.flag-fb{width:22px!important;height:16px!important}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div>
      <h1>🏆 FIFA World Cup 2026 <em>· Tunisia Time</em></h1>
      <p class="hdr-sub">All times UTC+1 · Powered by ESPN · Auto-refreshes every 60s</p>
    </div>
    <div class="hdr-right">
      <span class="api-status-dot dot-loading" id="apiDot"></span>
      <span class="status-txt" id="apiTxt">Loading…</span>
      <button class="tbtn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </div>
  </div>
</header>

<div class="sbar">
  <div class="sbar-in">
    <div class="sp"><span class="sdot sg"></span><b id="cg">–</b> good hours</div>
    <div class="sp"><span class="sdot sy"></span><b id="cy">–</b> borderline</div>
    <div class="sp"><span class="sdot sr"></span><b id="cr">–</b> rough</div>
    <div class="sp"><span class="sdot sa"></span><b id="ctn">–</b> 🇹🇳 Tunisia</div>
    <div class="sp" id="totalSp" style="display:none"><b id="ctotal">–</b> total matches</div>
  </div>
</div>

<div class="fbar">
  <div class="fbar-in">
    <span class="flbl">Filter</span>
    <button class="fb active" data-f="all">All</button>
    <button class="fb" data-f="tn">🇹🇳 Tunisia</button>
    <button class="fb fg" data-f="green">🟢 Good hours</button>
    <button class="fb fy" data-f="yellow">🟡 Borderline</button>
    <button class="fb ft" data-f="today" id="todayBtn">📅 Today</button>
  </div>
</div>

<main class="main" id="schedule">
  <!-- skeleton -->
  <div style="margin-bottom:24px">
    <div class="day-lbl" style="width:100px;height:10px;background:var(--border);border-radius:4px;border:none;margin-bottom:12px"></div>
    <div class="skeleton-grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </div>
</main>

<script>
// ── CONSTANTS ──
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';
const TZ_OFFSET = 1; // Tunisia UTC+1

// Country name → ISO2 for flagcdn
const FLAGS = {
  'Mexico':'mx','South Africa':'za','South Korea':'kr','Korea Republic':'kr',
  'Czech Republic':'cz','Czechia':'cz','Canada':'ca',
  'Bosnia-Herzegovina':'ba','Bosnia and Herzegovina':'ba',
  'United States':'us','USA':'us','Paraguay':'py',
  'Qatar':'qa','Switzerland':'ch','Brazil':'br','Morocco':'ma',
  'Haiti':'ht','Scotland':'gb-sct','Australia':'au',
  'Turkey':'tr','Türkiye':'tr','Germany':'de',
  'Curaçao':'cw','Curacao':'cw','Netherlands':'nl','Japan':'jp',
  "Côte d'Ivoire":'ci','Ivory Coast':'ci','Ecuador':'ec',
  'Sweden':'se','Tunisia':'tn','Spain':'es',
  'Cape Verde':'cv','Cabo Verde':'cv','Belgium':'be',
  'Egypt':'eg','Saudi Arabia':'sa','Uruguay':'uy','Iran':'ir',
  'New Zealand':'nz','France':'fr','Senegal':'sn','Iraq':'iq',
  'Norway':'no','Argentina':'ar','Algeria':'dz','Austria':'at',
  'Jordan':'jo','Ghana':'gh','Panama':'pa','England':'gb-eng',
  'Croatia':'hr','Portugal':'pt','DR Congo':'cd','Congo DR':'cd',
  'Uzbekistan':'uz','Colombia':'co','Wales':'gb-wls','Serbia':'rs',
  'Denmark':'dk','Poland':'pl','Ukraine':'ua','Romania':'ro',
  'Greece':'gr','Turkey':'tr','Slovakia':'sk','Hungary':'hu',
  'Slovenia':'si','Israel':'il','Iceland':'is','Finland':'fi',
  'Kosovo':'xk','Albania':'al','Montenegro':'me','Armenia':'am',
  'Georgia':'ge','Kazakhstan':'kz','Luxembourg':'lu','Azerbaijan':'az',
  'Faroe Islands':'fo','Gibraltar':'gi','Malta':'mt','Andorra':'ad',
  'Liechtenstein':'li','San Marino':'sm','Moldova':'md',
  'Latvia':'lv','Lithuania':'lt','Estonia':'ee','Belarus':'by',
  'North Macedonia':'mk','Bosnia':'ba'
};

// Global state
let ALL_MATCHES = [];   // normalised match objects
let LIVE = {};          // key → live score data
let lastFetch = null;
let refreshTimer = null;
let currentFilter = 'all';

// ── UTILS ──
function flagImg(name, size=28) {
  const h = Math.round(size * 0.75);
  const code = FLAGS[name];
  if (!code) return `<span class="flag-fb" style="width:${size}px;height:${h}px">${name.slice(0,2).toUpperCase()}</span>`;
  const cdnSize = size <= 20 ? 20 : size <= 40 ? 40 : 80;
  const ini = name.slice(0,2).toUpperCase();
  return `<img src="https://flagcdn.com/w${cdnSize}/${code}.webp" width="${size}" height="${h}" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flag-fb',textContent:'${ini}',style:'width:${size}px;height:${h}px'}))">`;
}

// Convert UTC date string → Tunisia local time string "HH:MM"
function toTunisiaTime(utcStr) {
  const d = new Date(utcStr);
  const h = (d.getUTCHours() + TZ_OFFSET) % 24;
  const m = d.getUTCMinutes();
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// Display date in Tunisia tz "Mon 15 Jun"
function toTunisiaDate(utcStr) {
  const d = new Date(new Date(utcStr).getTime() + TZ_OFFSET * 3600000);
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'});
}

// Today string in Tunisia tz
function todayTunisia() {
  const d = new Date(Date.now() + TZ_OFFSET * 3600000);
  return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'});
}

// Watch suitability based on Tunisia local hour
function suitability(utcStr) {
  const d = new Date(utcStr);
  const h = (d.getUTCHours() + TZ_OFFSET) % 24;
  if (h >= 15 && h <= 23) return {cls:'green', label:'Good time', icon:'🟢'};
  if ((h >= 12 && h < 15) || (h === 0)) return {cls:'yellow', label:'Borderline', icon:'🟡'};
  return {cls:'red', label:'Rough hours', icon:'🔴'};
}

function isTunisia(m) {
  return m.home.includes('Tunisia') || m.away.includes('Tunisia');
}

function gcalUrl(m) {
  const fmt = d => d.replace(/[-:]/g,'').replace('.000Z','Z');
  const start = fmt(new Date(new Date(m.utcDate).getTime()).toISOString());
  const end = fmt(new Date(new Date(m.utcDate).getTime() + 7200000).toISOString());
  const title = m.isFinal ? '🏆 FIFA World Cup 2026 Final' : `FIFA WC 2026: ${m.home} vs ${m.away}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${start}/${end}&location=${encodeURIComponent(m.venue)}`;
}

function dlIcs(idx) {
  const m = ALL_MATCHES[idx];
  const fmt = d => d.replace(/[-:.Z]/g,'').slice(0,15);
  const start = fmt(new Date(new Date(m.utcDate).getTime() + TZ_OFFSET*3600000).toISOString());
  const end   = fmt(new Date(new Date(m.utcDate).getTime() + TZ_OFFSET*3600000 + 7200000).toISOString());
  const title = m.isFinal ? '🏆 FIFA World Cup 2026 Final' : `FIFA WC 2026: ${m.home} vs ${m.away}`;
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WC2026//EN','BEGIN:VEVENT',
    `UID:wc2026-${idx}-${start}@tn`,
    `DTSTART;TZID=Africa/Tunis:${start}`,
    `DTEND;TZID=Africa/Tunis:${end}`,
    `SUMMARY:${title}`,
    `LOCATION:${m.venue}`,
    `DESCRIPTION:${m.round} | ${m.suit.icon} ${m.suit.label}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
  a.download = title.replace(/[^\w]/g,'_') + '.ics';
  a.click();
}

// ── ESPN FETCH ──
async function fetchAll() {
  setStatus('loading', 'Loading…');
  try {
    // Fetch all WC 2026 matches — use date range
    const dates = '20260611-20260719';
    const url = `${ESPN}?dates=${dates}&limit=100`;
    const r = await fetch(url, {headers:{'Accept':'application/json'}});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    parseMatches(data.events || []);
    setStatus('ok', `${ALL_MATCHES.length} matches loaded`);
  } catch(e) {
    // ESPN blocked or tournament not started yet — use static fallback
    console.warn('ESPN fetch failed:', e.message, '— using static fallback');
    loadStaticFallback();
    setStatus('err', 'Live data unavailable — showing static schedule');
  }
}

async function fetchLive() {
  try {
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const r = await fetch(`${ESPN}?dates=${ymd}`, {headers:{'Accept':'application/json'}});
    if (!r.ok) return;
    const data = await r.json();
    LIVE = {};
    (data.events || []).forEach(ev => {
      const comp = ev.competitions?.[0];
      if (!comp) return;
      const home = comp.competitors?.find(c => c.homeAway === 'home');
      const away = comp.competitors?.find(c => c.homeAway === 'away');
      if (!home || !away) return;
      const key = (home.team.displayName + '|' + away.team.displayName).toLowerCase();
      LIVE[key] = {
        status: comp.status?.type?.name,
        clock: comp.status?.displayClock || '',
        homeScore: home.score ?? '',
        awayScore: away.score ?? '',
      };
    });
    lastFetch = new Date();
    // Update score badges without full re-render
    document.querySelectorAll('.mc[data-lk]').forEach(card => {
      const key = card.dataset.lk;
      const si = card.querySelector('.si');
      if (si) si.innerHTML = scoreHtml(key);
      const d = LIVE[key];
      card.classList.toggle('live-now', !!(d && d.status === 'STATUS_IN_PROGRESS'));
    });
    // Update today header if visible
    const updEl = document.getElementById('upd-time');
    if (updEl) updEl.textContent = `Updated ${lastFetch.toLocaleTimeString()}`;
    updateLiveCount();
  } catch(e) { /* silent */ }
}

function parseMatches(events) {
  ALL_MATCHES = [];
  events.forEach(ev => {
    const comp = ev.competitions?.[0];
    if (!comp) return;
    const home = comp.competitors?.find(c => c.homeAway === 'home');
    const away = comp.competitors?.find(c => c.homeAway === 'away');
    const homeName = home?.team?.displayName || 'TBD';
    const awayName = away?.team?.displayName || 'TBD';
    const utcDate = ev.date;
    const suit = suitability(utcDate);
    const round = comp.series?.type?.abbreviation
      || ev.season?.type?.abbreviation
      || comp.notes?.[0]?.headline
      || 'Group Stage';
    ALL_MATCHES.push({
      id: ev.id,
      home: homeName,
      away: awayName,
      utcDate,
      timeStr: toTunisiaTime(utcDate),
      dateStr: toTunisiaDate(utcDate),
      venue: comp.venue?.fullName || comp.venue?.address?.city || 'USA',
      round: round,
      suit,
      lk: (homeName + '|' + awayName).toLowerCase(),
      isFinal: round.toLowerCase().includes('final') && !round.toLowerCase().includes('semi') && !round.toLowerCase().includes('quarter'),
    });
  });
  // Sort by date
  ALL_MATCHES.sort((a,b) => new Date(a.utcDate) - new Date(b.utcDate));
  updateStats();
  renderCurrent();
}

// ── STATS ──
function updateStats() {
  let g=0,y=0,r=0,tn=0;
  ALL_MATCHES.forEach(m => {
    if(m.suit.cls==='green')g++; else if(m.suit.cls==='yellow')y++; else r++;
    if(isTunisia(m))tn++;
  });
  document.getElementById('cg').textContent=g;
  document.getElementById('cy').textContent=y;
  document.getElementById('cr').textContent=r;
  document.getElementById('ctn').textContent=tn;
  document.getElementById('ctotal').textContent=ALL_MATCHES.length;
  document.getElementById('totalSp').style.display='flex';
}

function updateLiveCount() {
  const liveCount = Object.values(LIVE).filter(d=>d.status==='STATUS_IN_PROGRESS').length;
  const btn = document.getElementById('todayBtn');
  if (liveCount > 0) btn.textContent = `📅 Today · ${liveCount} LIVE`;
  else btn.textContent = '📅 Today';
}

// ── SCORE HTML ──
function scoreHtml(lk) {
  const d = LIVE[lk];
  if (!d || !d.status || d.status === 'STATUS_SCHEDULED') return '';
  if (d.status === 'STATUS_IN_PROGRESS') {
    return `<div class="score-wrap">
      <span class="score-n">${d.homeScore}</span>
      <span class="score-sep">–</span>
      <span class="score-n">${d.awayScore}</span>
      <span class="live-badge"><span class="live-pulse"></span>${d.clock||'LIVE'}</span>
    </div>`;
  }
  if (d.status === 'STATUS_FINAL') {
    return `<div class="score-wrap">
      <span class="score-n">${d.homeScore}</span>
      <span class="score-sep">–</span>
      <span class="score-n">${d.awayScore}</span>
    </div><div class="score-ft">Full time</div>`;
  }
  return '';
}

// ── CARD ──
function buildCard(m, idx) {
  const tn = isTunisia(m) ? ' tn' : '';
  const fin = m.isFinal ? ' fin-match' : '';
  const bCls = m.isFinal ? ' fin-b' : m.round.toLowerCase().includes('round')||m.round.toLowerCase().includes('quarter')||m.round.toLowerCase().includes('semi') ? ' ko-b' : '';
  const isTBD = m.home === 'TBD' || m.away === 'TBD';

  const teamsHtml = isTBD
    ? `<div class="tbd-teams"><span class="tbd-lbl">🏆 ${m.round === 'Final' ? 'World Cup Final' : m.round}</span></div>`
    : `<div class="mc-teams">
        <div class="mc-team">${flagImg(m.home,28)}<span class="tname">${m.home}</span></div>
        <div class="mc-vs">vs</div>
        <div class="mc-team">${flagImg(m.away,28)}<span class="tname">${m.away}</span></div>
      </div>`;

  const title = m.isFinal ? '🏆 FIFA World Cup 2026 Final' : `FIFA WC 2026: ${m.home} vs ${m.away}`;

  return `<div class="mc${tn}${fin}" data-lk="${m.lk}">
    <div class="mc-top">
      <span class="mc-badge${bCls}">${m.round}</span>
      <div class="mc-time-wrap">
        <span class="mc-time">${m.timeStr}</span>
        <span class="mc-cdot d${m.suit.cls[0]}"></span>
      </div>
    </div>
    ${teamsHtml}
    <div class="si">${scoreHtml(m.lk)}</div>
    <div class="mc-meta">
      <span class="mc-venue">${m.venue}</span>
      <span class="mc-suit sc-${m.suit.cls}">${m.suit.icon} ${m.suit.label}</span>
    </div>
    <div class="mc-cal">
      <a class="cbtn cg" href="${gcalUrl(m)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5C3.9 4 3 4.9 3 6v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
        Google Cal
      </a>
      <button class="cbtn ci" onclick="dlIcs(${idx})">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 110 2 1 1 0 010-2zm4 11H8v-1.5l3-3 1.5 1.5 3-3 1.5 1.5V17z"/></svg>
        .ics
      </button>
    </div>
  </div>`;
}

// ── RENDER ──
function renderCurrent() { render(currentFilter); }

function render(filter) {
  currentFilter = filter;
  const el = document.getElementById('schedule');

  let matches = ALL_MATCHES.map((m,i) => ({m,i}));

  if (filter === 'today') {
    const today = todayTunisia();
    matches = matches.filter(({m}) => m.dateStr === today);
    if (!matches.length) {
      el.innerHTML = '<p class="msg">No matches today.</p>';
      return;
    }
    const liveCount = matches.filter(({m}) => LIVE[m.lk]?.status === 'STATUS_IN_PROGRESS').length;
    const upd = lastFetch ? `<span class="upd-time" id="upd-time">Updated ${lastFetch.toLocaleTimeString()}</span>` : '<span class="upd-time" id="upd-time"></span>';
    let html = `<div style="margin-bottom:24px">
      <div class="today-hdr">
        <span class="today-lbl">Today · ${today}</span>
        ${liveCount ? `<span class="live-count">${liveCount} LIVE</span>` : ''}
        <button class="refresh-btn" onclick="fetchLive()">↻ Refresh</button>
        ${upd}
      </div>
      <div class="day-grid">`;
    matches.forEach(({m,i}) => { html += buildCard(m,i); });
    html += '</div></div>';
    el.innerHTML = html;
    return;
  }

  if (filter === 'tn') matches = matches.filter(({m}) => isTunisia(m));
  else if (filter === 'green') matches = matches.filter(({m}) => m.suit.cls === 'green');
  else if (filter === 'yellow') matches = matches.filter(({m}) => m.suit.cls === 'yellow');

  if (!matches.length) { el.innerHTML = '<p class="msg">No matches for this filter.</p>'; return; }

  // Group by date
  const byDate = {};
  matches.forEach(({m,i}) => {
    if (!byDate[m.dateStr]) byDate[m.dateStr] = [];
    byDate[m.dateStr].push({m,i});
  });

  let html = '';
  for (const [date, items] of Object.entries(byDate)) {
    html += `<div class="day-block"><div class="day-lbl">${date}</div><div class="day-grid">`;
    items.forEach(({m,i}) => { html += buildCard(m,i); });
    html += '</div></div>';
  }
  el.innerHTML = html;
}

// ── STATUS ──
function setStatus(type, msg) {
  const dot = document.getElementById('apiDot');
  const txt = document.getElementById('apiTxt');
  dot.className = 'api-status-dot ' + {ok:'dot-ok',loading:'dot-loading',err:'dot-err'}[type];
  txt.textContent = msg;
}

// ── FILTERS ──
document.querySelectorAll('.fb').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.fb').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.f);
    if (b.dataset.f === 'today') fetchLive();
  });
});

// ── THEME ──
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}
function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'); }
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);

fetchAll();
refreshTimer = setInterval(fetchLive, 60000);
